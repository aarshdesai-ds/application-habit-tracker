[project]
name = "job-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aarsh Desai", email = "desai186@purdue.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=4.1.6",
]

[tool.uv]
# Project lives in OneDrive, which rejects hardlinks into the uv cache (os error 396)
link-mode = "copy"

[project.scripts]
job-tracker = "job_tracker:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
